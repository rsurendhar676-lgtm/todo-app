<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App - Developer A</title>
    <script>
      (function () {
        var THEME_KEY = "todo-app.theme";
        var theme = null;
        try {
          theme = localStorage.getItem(THEME_KEY);
        } catch (error) {}
        if (theme !== "light" && theme !== "dark") {
          theme =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body
    class="min-h-screen bg-slate-100 font-sans text-slate-800 antialiased transition-colors duration-200 dark:bg-slate-950 dark:text-slate-100"
  >
    <div class="mx-auto w-full max-w-xl px-4 py-8 sm:px-6 sm:py-12">
      <div
        class="rounded-2xl border border-slate-200 bg-white p-5 shadow-lg shadow-slate-200/70 transition-colors duration-200 sm:p-8 dark:border-slate-800 dark:bg-slate-900 dark:shadow-black/40"
      >
        <header class="mb-6 flex items-start justify-between gap-4">
          <div>
            <h1 class="m-0 text-2xl font-semibold tracking-tight text-slate-900 sm:text-3xl dark:text-white">
              Todo App
            </h1>
            <p class="tagline mt-1 mb-0 text-sm text-slate-500 sm:text-base dark:text-slate-400">
              Keep track of what you need to do.
            </p>
          </div>
          <button
            type="button"
            id="theme-toggle"
            class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-slate-200 bg-slate-50 text-slate-700 shadow-sm transition-colors duration-200 hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700"
            aria-pressed="false"
            aria-label="Switch to dark theme"
          >
            <svg
              class="h-5 w-5 dark:hidden"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"
              />
            </svg>
            <svg
              class="hidden h-5 w-5 dark:block"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                stroke-linecap="round"
                d="M12 3v1.5M12 19.5V21M4.5 12H3M21 12h-1.5M6.2 6.2l-1-1M18.8 18.8l-1-1M6.2 17.8l-1 1M18.8 5.2l-1 1"
              />
            </svg>
          </button>
        </header>

        <form id="todo-form" class="todo-form flex flex-col gap-3 sm:flex-row sm:items-stretch">
          <label for="todo-input" class="sr-only">New todo</label>
          <input
            id="todo-input"
            type="text"
            name="title"
            placeholder="What needs to be done?"
            autocomplete="off"
            class="min-h-11 w-full flex-1 rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-slate-900 shadow-sm placeholder:text-slate-400 transition-colors duration-200 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:placeholder:text-slate-500"
          />
          <button
            type="submit"
            class="min-h-11 rounded-xl bg-indigo-600 px-5 py-2.5 font-medium text-white shadow-sm transition-colors duration-200 hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500"
          >
            Add
          </button>
        </form>

        <div
          class="toolbar mt-5 mb-3 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"
        >
          <div class="filters flex flex-wrap gap-2" role="group" aria-label="Filter todos">
            <button
              type="button"
              class="filter-btn rounded-lg border border-slate-200 bg-transparent px-3 py-1.5 text-sm font-medium text-slate-600 transition-colors duration-200 hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 aria-pressed:border-indigo-600 aria-pressed:bg-indigo-600 aria-pressed:text-white dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800 dark:aria-pressed:border-indigo-500 dark:aria-pressed:bg-indigo-500 dark:aria-pressed:text-white"
              data-filter="all"
              aria-pressed="true"
            >
              All
            </button>
            <button
              type="button"
              class="filter-btn rounded-lg border border-slate-200 bg-transparent px-3 py-1.5 text-sm font-medium text-slate-600 transition-colors duration-200 hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 aria-pressed:border-indigo-600 aria-pressed:bg-indigo-600 aria-pressed:text-white dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800 dark:aria-pressed:border-indigo-500 dark:aria-pressed:bg-indigo-500 dark:aria-pressed:text-white"
              data-filter="active"
              aria-pressed="false"
            >
              Active
            </button>
            <button
              type="button"
              class="filter-btn rounded-lg border border-slate-200 bg-transparent px-3 py-1.5 text-sm font-medium text-slate-600 transition-colors duration-200 hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 aria-pressed:border-indigo-600 aria-pressed:bg-indigo-600 aria-pressed:text-white dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800 dark:aria-pressed:border-indigo-500 dark:aria-pressed:bg-indigo-500 dark:aria-pressed:text-white"
              data-filter="completed"
              aria-pressed="false"
            >
              Completed
            </button>
          </div>
          <p
            id="todo-count"
            class="todo-count m-0 text-sm text-slate-500 dark:text-slate-400"
            aria-live="polite"
          ></p>
        </div>

        <p
          id="empty-state"
          class="empty-state my-8 rounded-xl border border-dashed border-slate-200 px-4 py-8 text-center text-slate-500 dark:border-slate-700 dark:text-slate-400"
          hidden
        >
          No todos to show.
        </p>

        <ul
          id="todo-list"
          class="todo-list m-0 list-none overflow-hidden rounded-xl border border-slate-200 bg-white p-0 empty:hidden dark:border-slate-700 dark:bg-slate-900"
        ></ul>

        <div class="footer-actions mt-4 flex justify-end">
          <button
            type="button"
            id="clear-completed"
            class="rounded-lg border border-slate-200 bg-transparent px-3 py-1.5 text-sm font-medium text-slate-500 transition-colors duration-200 hover:border-slate-300 hover:bg-slate-50 hover:text-slate-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 dark:border-slate-700 dark:text-slate-400 dark:hover:border-slate-600 dark:hover:bg-slate-800 dark:hover:text-slate-100"
          >
            Clear completed
          </button>
        </div>
      </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/render.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
